<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>실전 단어장 — 토익 필수 어휘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#152238;
    --navy-2:#1f3153;
    --paper:#f6f4ef;
    --paper-2:#ece8de;
    --gold:#c99a44;
    --gold-2:#e0b768;
    --red:#a94438;
    --green:#3f6b4f;
    --line: rgba(21,34,56,0.12);
    --shadow: 0 18px 40px -18px rgba(21,34,56,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'IBM Plex Sans KR', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1c2c4a 0%, var(--navy) 55%, #0f1826 100%);
    color:var(--paper);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 28px 16px 60px;
  }
  .wrap{ width:100%; max-width:460px; }

  header{ text-align:center; margin-bottom:22px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold-2); opacity:.9; margin-bottom:6px;
  }
  h1{
    font-size:26px; margin:0 0 4px; font-weight:700; letter-spacing:-0.01em;
  }
  .sub{ font-size:13px; color:rgba(246,244,239,0.6); }

  /* Category chips */
  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:14px 2px 20px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; padding:7px 14px; border-radius:999px;
    border:1px solid rgba(246,244,239,0.18); background:rgba(246,244,239,0.05);
    color:rgba(246,244,239,0.75); font-size:12.5px; font-weight:500;
    cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .chip.active{ background:var(--gold-2); color:var(--navy); border-color:var(--gold-2); font-weight:600; }

  /* Progress / stamp bar */
  .stats{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    color:rgba(246,244,239,0.55); margin-bottom:14px; padding:0 4px;
  }
  .stats b{ color:var(--gold-2); font-weight:600; }
  .progress-track{
    height:4px; border-radius:2px; background:rgba(246,244,239,0.12);
    margin-bottom:22px; overflow:hidden;
  }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-2)); width:0%; transition:width .3s; }

  /* Card */
  .stage{ perspective:1400px; margin-bottom:22px; }
  .card{
    position:relative; height:300px; border-radius:20px;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.9,.25,1);
    cursor:pointer;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:20px; padding:26px;
    display:flex; flex-direction:column;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .face-front{
    background: linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    color:var(--navy);
    justify-content:space-between;
  }
  .face-back{
    background: linear-gradient(160deg, var(--navy-2) 0%, var(--navy) 100%);
    color:var(--paper);
    transform:rotateY(180deg);
    justify-content:space-between;
  }
  .card-index{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:.14em; text-transform:uppercase; opacity:.55;
  }
  .card-mid{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .word{ font-size:32px; font-weight:700; letter-spacing:-0.01em; margin-bottom:8px; }
  .pos{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:11px;
    padding:3px 9px; border-radius:5px; background:rgba(21,34,56,0.08);
    color:var(--navy-2); width:fit-content; margin-bottom:14px; font-weight:600;
  }
  .face-back .pos{ background:rgba(246,244,239,0.12); color:var(--gold-2); }
  .example{ font-size:14px; line-height:1.55; opacity:.75; }
  .meaning{ font-size:24px; font-weight:600; margin-bottom:10px; }
  .meaning-ex{ font-size:14px; line-height:1.6; color:rgba(246,244,239,0.65); }
  .hint{ font-size:11px; text-align:center; opacity:.5; font-family:'IBM Plex Mono', monospace; }

  /* Controls */
  .actions{ display:flex; gap:10px; margin-bottom:14px; }
  .btn{
    flex:1; padding:15px 0; border-radius:14px; border:none;
    font-size:14.5px; font-weight:600; cursor:pointer; transition:.15s;
    font-family:'IBM Plex Sans KR', sans-serif;
  }
  .btn-again{ background:rgba(169,68,56,0.15); color:#e08c80; border:1px solid rgba(169,68,56,0.35); }
  .btn-again:active{ background:rgba(169,68,56,0.3); }
  .btn-known{ background:var(--green); color:#e9f3ec; }
  .btn-known:active{ filter:brightness(1.1); }

  .nav-row{ display:flex; justify-content:center; gap:18px; margin-top:6px; }
  .nav-btn{
    background:none; border:none; color:rgba(246,244,239,0.5);
    font-family:'IBM Plex Mono', monospace; font-size:12px; cursor:pointer;
    padding:8px 6px;
  }
  .nav-btn:active{ color:var(--gold-2); }

  footer{ margin-top:30px; text-align:center; font-size:11px; color:rgba(246,244,239,0.3); font-family:'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Business &amp; Exam Vocabulary</div>
    <h1>실전 단어장</h1>
    <div class="sub">토익·실무 영어 필수 어휘 플래시카드</div>
  </header>

  <div class="chips" id="chips"></div>

  <div class="stats">
    <span>진행 <b id="statPos">1</b> / <span id="statTotal">0</span></span>
    <span>외운 단어 <b id="statKnown">0</b></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face face-front">
        <div class="card-index" id="frontIndex">001</div>
        <div class="card-mid">
          <div class="word" id="wordText">—</div>
          <div class="pos" id="posText">n.</div>
          <div class="example" id="exampleText"></div>
        </div>
        <div class="hint">탭하면 뜻이 보여요</div>
      </div>
      <div class="face face-back">
        <div class="card-index" id="backIndex">001</div>
        <div class="card-mid">
          <div class="pos" id="posTextBack">n.</div>
          <div class="meaning" id="meaningText">—</div>
          <div class="meaning-ex" id="meaningExText"></div>
        </div>
        <div class="hint">탭하면 다시 단어가 보여요</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-again" id="btnAgain">다시 볼게요</button>
    <button class="btn btn-known" id="btnKnown">외웠어요 ✓</button>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="btnPrev">← 이전</button>
    <button class="nav-btn" id="btnShuffle">🔀 섞기</button>
    <button class="nav-btn" id="btnReset">진행 초기화</button>
  </div>

  <footer>STUDY DECK — TOEIC CORE 100</footer>
</div>

<script>

  {w:"guided tour",pos:"n.",ex:"We joined a guided tour of the museum.",m:"가이드 동반 투어",mx:"우리는 박물관 가이드 투어에 참여했다.",cat:"trip"},
  {w:"travel insurance",pos:"n.",ex:"It's wise to buy travel insurance.",m:"여행자 보험",mx:"여행자 보험에 가입하는 것이 현명하다.",cat:"trip"},
  {w:"local currency",pos:"n.",ex:"Exchange some money for local currency.",m:"현지 통화",mx:"돈을 현지 통화로 좀 환전하세요.",cat:"trip"},
  {w:"tip",pos:"n.",ex:"Tipping is not common in this country.",m:"팁",mx:"이 나라에서는 팁을 주는 것이 흔하지 않다.",cat:"trip"},
  {w:"public transportation",pos:"n.",ex:"Public transportation here is very convenient.",m:"대중교통",mx:"이곳 대중교통은 매우 편리하다.",cat:"trip"},
  {w:"one-way ticket",pos:"n.",ex:"I bought a one-way ticket to Busan.",m:"편도 티켓",mx:"나는 부산행 편도 티켓을 샀다.",cat:"trip"},
  {w:"round-trip",pos:"adj.",ex:"A round-trip ticket is cheaper than two one-ways.",m:"왕복의",mx:"왕복 티켓이 편도 두 장보다 저렴하다.",cat:"trip"},
  {w:"detour",pos:"n.",ex:"We took a detour because of road work.",m:"우회로",mx:"우리는 도로 공사 때문에 우회로로 갔다.",cat:"trip"},
  {w:"lost and found",pos:"n.",ex:"I found my wallet at the lost and found.",m:"분실물 보관소",mx:"나는 분실물 보관소에서 지갑을 찾았다.",cat:"trip"},
  {w:"vaccination",pos:"n.",ex:"Some countries require proof of vaccination.",m:"예방접종",mx:"일부 국가는 예방접종 증명서를 요구한다.",cat:"trip"}
];

const CATS = [
  {id:"all", label:"전체"},
  {id:"office", label:"사무"},
  {id:"meeting", label:"회의"},
  {id:"hr", label:"인사"},
  {id:"contract", label:"계약"},
  {id:"finance", label:"재무"},
  {id:"travel", label:"출장"},
  {id:"logistics", label:"물류"},
  {id:"customer", label:"고객응대"},
  {id:"marketing", label:"마케팅"},
  {id:"business", label:"비즈니스"},
  {id:"conversation", label:"일상 회화"},
  {id:"trip", label:"여행"}
];

let currentCat = "all";
let deck = [];
let pos = 0;
let flipped = false;
let known = new Set(JSON.parse(localStorage.getItem("toeicvocab_known") || "[]"));

const chipsEl = document.getElementById("chips");
const cardEl = document.getElementById("card");
const wordText = document.getElementById("wordText");
const posText = document.getElementById("posText");
const posTextBack = document.getElementById("posTextBack");
const exampleText = document.getElementById("exampleText");
const meaningText = document.getElementById("meaningText");
const meaningExText = document.getElementById("meaningExText");
const frontIndex = document.getElementById("frontIndex");
const backIndex = document.getElementById("backIndex");
const statPos = document.getElementById("statPos");
const statTotal = document.getElementById("statTotal");
const statKnown = document.getElementById("statKnown");
const progressFill = document.getElementById("progressFill");

function buildChips(){
  chipsEl.innerHTML = "";
  CATS.forEach(c=>{
    const el = document.createElement("div");
    el.className = "chip" + (c.id===currentCat ? " active" : "");
    el.textContent = c.label;
    el.onclick = ()=>{ currentCat = c.id; pos = 0; flipped=false; buildDeck(); buildChips(); render(); };
    chipsEl.appendChild(el);
  });
}

function buildDeck(){
  deck = currentCat === "all" ? [...VOCAB] : VOCAB.filter(v=>v.cat===currentCat);
}

function shuffle(){
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  pos = 0; flipped=false; render();
}

function render(){
  if(deck.length===0){ return; }
  const item = deck[pos];
  wordText.textContent = item.w;
  posText.textContent = item.pos;
  posTextBack.textContent = item.pos;
  exampleText.textContent = item.ex;
  meaningText.textContent = item.m;
  meaningExText.textContent = item.mx;
  const idxStr = String(pos+1).padStart(3,"0");
  frontIndex.textContent = idxStr;
  backIndex.textContent = idxStr;
  cardEl.classList.toggle("flipped", flipped);

  statPos.textContent = pos+1;
  statTotal.textContent = deck.length;
  const knownInDeck = deck.filter(d=>known.has(d.w)).length;
  statKnown.textContent = knownInDeck;
  progressFill.style.width = (deck.length ? (knownInDeck/deck.length*100) : 0) + "%";
}

function next(){
  pos = (pos+1) % deck.length;
  flipped = false;
  render();
}
function prev(){
  pos = (pos-1+deck.length) % deck.length;
  flipped = false;
  render();
}

cardEl.addEventListener("click", ()=>{ flipped = !flipped; render(); });

document.getElementById("btnKnown").onclick = (e)=>{
  e.stopPropagation();
  known.add(deck[pos].w);
  localStorage.setItem("toeicvocab_known", JSON.stringify([...known]));
  next();
};
document.getElementById("btnAgain").onclick = (e)=>{
  e.stopPropagation();
  known.delete(deck[pos].w);
  localStorage.setItem("toeicvocab_known", JSON.stringify([...known]));
  next();
};
document.getElementById("btnPrev").onclick = (e)=>{ e.stopPropagation(); prev(); };
document.getElementById("btnShuffle").onclick = (e)=>{ e.stopPropagation(); shuffle(); };
document.getElementById("btnReset").onclick = (e)=>{
  e.stopPropagation();
  if(confirm("외운 단어 기록을 모두 초기화할까요?")){
    known.clear();
    localStorage.setItem("toeicvocab_known", JSON.stringify([]));
    render();
  }
};

buildChips();
buildDeck();
render();
</script>
</body>
</html>
